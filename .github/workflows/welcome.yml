name: Приветствие новых участников

on:
  issues:
    types: [opened]
  pull_request_target:
    branches: [main]
    types: [opened]

jobs:
  greet:
    name: Приветствие
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          pr-message: |
            Спасибо за помощь в улучшении русского перевода System Design 101! 🎉

            Ознакомьтесь с правилами участия в CONTRIBUTING.md этого репозитория.

            Спасибо, что помогаете сделать материалы понятнее! 🌟
